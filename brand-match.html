:root[data-theme="dark"]{
  --bg:#1a1815; --surface:#24201c; --sunk:#2f2a24; --fg:#f5ede0; --muted:#b5aa96; --line:#3d372f;
  --accent:#f6bf6b; --accent-ink:#231f1b; --accent-soft:#3b2f1c; --gold:#f6bf6b; --gold-soft:#3b2f1c;
  --hot:#f08a5d; --warm:#f0c070; --cold:#80b1e9; --ok:#6cc391; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body)}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 40px;display:flex;flex-direction:column;gap:16px;min-height:100vh;min-height:100dvh}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--apricot);color:var(--ink);border-radius:16px;padding:8px 18px}
.logo{height:64px;width:auto;display:block;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.xp{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);font-variant-numeric:tabular-nums;position:relative}
.xp b{color:var(--ink);font-size:18px;letter-spacing:0}
.pop{position:absolute;right:calc(100% + 6px);top:2px;color:var(--ink);font-weight:800;opacity:0;pointer-events:none}
.pop.go{animation:pop .9s ease-out}
@keyframes pop{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.meter{display:flex;flex-direction:column;gap:6px}
.track{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--apricot),#e09a2f);transition:width .45s cubic-bezier(.3,.8,.3,1)}
.levels{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.levels span.on{color:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 22px;display:flex;flex-direction:column;gap:18px}
.step-n{font-size:12px;font-weight:600;color:var(--gold);letter-spacing:.16em}
h1,h2{font:700 clamp(25px,5.8vw,34px)/1.12 var(--display);margin:0;text-wrap:balance}
.sub{margin:-8px 0 0;color:var(--muted);font-size:15px}
.part{display:flex;flex-direction:column;gap:10px}
.part > .lab{font-weight:700;font-size:14.5px}
.part > .lab small{font-weight:500;color:var(--muted)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;min-height:64px;transition:transform .12s,border-color .12s,background .12s}
.opt strong{font-weight:700;font-size:15px}
.opt em{font-style:normal;font-size:13px;color:var(--muted)}
.opt:hover{border-color:var(--accent)}
.opt:active{transform:scale(.98)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed="true"] strong::after{content:" ✓";color:var(--accent)}
.opt:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.other{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:var(--accent-soft)}
.other label{font-weight:600;font-size:14.5px}
.phone{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:8px}
.picker{display:inline-flex;align-items:center;gap:10px;align-self:flex-start;margin-top:-6px;padding:7px 8px 7px 14px;border-radius:999px;background:var(--apricot);color:var(--ink);font-weight:600;font-size:14px}
.picker b{display:inline-block;min-width:44px;text-align:center;padding:2px 10px;border-radius:999px;background:var(--ink);color:var(--apricot);font-variant-numeric:tabular-nums}
.err:empty{display:none}
.err{font-size:12.5px;color:var(--hot);min-height:1em}
@media (max-width:420px){.phone{grid-template-columns:minmax(0,130px) minmax(0,1fr)}}
.chip{all:unset;box-sizing:border-box;cursor:pointer;padding:9px 14px;border:1.5px solid var(--line);border-radius:999px;font-size:14.5px;font-weight:600;background:var(--bg)}
.chip[aria-pressed="true"]{background:var(--apricot);border-color:var(--apricot);color:var(--ink)}
input[type=text],input[type=tel],input[type=email],input[type=date],select,textarea{width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px}
textarea{min-height:96px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.nav{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{font:700 15px var(--body);border-radius:12px;padding:13px 20px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);min-width:160px;padding:15px 26px;font-size:16px;letter-spacing:.02em;box-shadow:0 6px 16px -8px rgb(49 45 41/.55);transition:transform .12s,box-shadow .12s}
.btn.primary:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 10px 20px -10px rgb(49 45 41/.6)}
.btn.primary:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent;border:0;color:var(--muted);padding:6px 2px;font-weight:500;font-size:14px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.btn.ghost:hover{color:var(--fg);text-decoration-color:currentColor}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12.5px;color:var(--muted)}
.intro-list{display:flex;flex-wrap:wrap;gap:8px;margin:0;padding:0;list-style:none}
.intro-list li{font-size:13.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:var(--gold-soft);color:var(--fg)}
/* result */
.badge{border-radius:18px;padding:24px 22px;background:var(--apricot);color:var(--ink);display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.badge .eyebrow{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8}
.badge h2{color:var(--ink);font-size:clamp(26px,6vw,34px)}
.badge p{margin:0;opacity:.92;max-width:52ch}
.badge .stats{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.badge .stats span{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgb(49 45 41/.1)}
.badge .mark{position:absolute;right:-10px;bottom:-14px;width:150px;opacity:.13;pointer-events:none}
.badge canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.next{display:flex;flex-direction:column;gap:8px}
.next h3{margin:0;font:700 17px var(--display)}
.next ul{margin:0;padding-left:18px;color:var(--muted)}
.msg{font-size:14px;padding:10px 14px;border-radius:10px;background:var(--gold-soft)}
.xpwrap{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.time{font-size:12px;color:var(--ink);opacity:.75;white-space:nowrap}
/* leads */
.leads-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.leads-head h1{font-size:26px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters input{max-width:240px}
.filters select{max-width:150px}
.lead{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.lead:hover{border-color:var(--accent)}
.lead .row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.lead h3{margin:0;font:700 17px var(--display)}
.meta{font-size:13px;color:var(--muted)}
.pill{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.Hot{color:var(--hot)}.pill.Warm{color:var(--warm)}.pill.Cold{color:var(--cold)}.pill.New{color:var(--accent)}
.list{display:flex;flex-direction:column;gap:10px}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
dl.sum{display:grid;grid-template-columns:minmax(110px,34%) 1fr;gap:8px 14px;margin:0}
dl.sum dt{color:var(--muted);font-size:13.5px}
dl.sum dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.notes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.notes .wide{grid-column:1/-1}
.notes label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:13.5px}
@media (max-width:340px){.opts{grid-template-columns:1fr}}
@media (max-width:480px){.opt{padding:12px;min-height:58px}.opt strong{font-size:14.5px}.opt em{font-size:12.5px}.card{padding:20px 16px}.notes{grid-template-columns:1fr}dl.sum{grid-template-columns:1fr;gap:2px}dl.sum dd{margin-bottom:8px}}
/* phone polish */
@media (max-width:480px){
  .wrap{padding-block:12px 24px;gap:12px}
  .top{padding:6px 14px;border-radius:14px}
  .logo{height:52px}
  h1,h2{font-size:24px}
  .sub{font-size:14.5px}
  .card{gap:16px}
  .nav{flex-wrap:nowrap;gap:14px}
  .nav .btn.primary{flex:1;min-width:0;padding-inline:16px}
  .badge{padding:20px 18px}
  .badge .mark{width:110px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  [SV.web]:"A website plan with page structure and must-have features",

/* ---------- state ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let A = {}, idx = -1, xp = 0, earned = new Set(), saved = false;
const flow = () => STEPS.filter(s => !s.when || s.when.some(w => (A.services||[]).includes(w)));
const has = v => Array.isArray(v) ? v.length>0 : !!(v && String(v).trim());
const COUNTRIES = [["IN","India","+91",10,10],["AE","UAE","+971",9,9],["SA","Saudi Arabia","+966",9,9],["QA","Qatar","+974",8,8],["OM","Oman","+968",8,8],["KW","Kuwait","+965",8,8],["BH","Bahrain","+973",8,8],["SG","Singapore","+65",8,8],["MY","Malaysia","+60",9,10],["LK","Sri Lanka","+94",9,9],["GB","United Kingdom","+44",10,10],["US","USA / Canada","+1",10,10],["AU","Australia","+61",9,9],["DE","Germany","+49",10,11],["XX","Other country","",6,15]];
const country = () => COUNTRIES.find(c=>c[0]===(A.country||"IN")) || COUNTRIES[0];
const phoneOk = () => { const c = country(), n = (A.phoneDigits||"").length; return n>=c[3] && n<=c[4]; };
const isOn = (p) => p.other && (p.multi ? (A[p.key]||[]).includes(p.other.val) : A[p.key]===p.other.val);
const partOk = p => p.type==="phone" ? phoneOk() : (p.optional || has(A[p.key])) && (!isOn(p) || has(A[p.other.key]));
const emailOk = v => !v || /^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v.trim());
const valid = s => s.parts.every(partOk) && (!s.final || emailOk(A.email));

function award(stepId, pts){
  if (earned.has(stepId)) return;
  earned.add(stepId); xp += pts; $("#xp").textContent = xp;
  const p = $("#pop"); p.textContent = "+"+pts; p.classList.remove("go"); void p.offsetWidth; p.classList.add("go");
}
function meter(){
  const f = flow(), pct = idx<0 ? 0 : Math.min(100, Math.round((idx)/(f.length)*100));
  $("#fill").style.width = (idx>=f.length?100:pct)+"%";
  const lvl = idx>=f.length ? 3 : Math.min(3, Math.floor(pct/25));
  [...$("#levels").children].forEach((s,i)=>s.classList.toggle("on", i<=lvl));
}

/* ---------- rendering ---------- */
function partHTML(p){
  const v = A[p.key];
  const lab = p.label ? `<div class="lab" id="l-${p.key}">${esc(p.label)}${p.optional?' <small>(optional)</small>':""}</div>` : "";
  if (p.type==="cards" || p.type==="chips"){
    const opts = p.options.map((o,i)=>{
      const [val,desc] = Array.isArray(o)?o:[o,""];
      const on = p.multi ? (v||[]).includes(val) : v===val;
      return p.type==="cards"
        ? `<button type="button" class="opt" data-k="${p.key}" data-v="${esc(val)}" aria-pressed="${on}"><strong>${esc(val)}</strong>${desc?`<em>${esc(desc)}</em>`:""}</button>`
        : `<button type="button" class="chip" data-k="${p.key}" data-v="${esc(val)}" aria-pressed="${on}">${esc(val)}</button>`;
    }).join("");
    const other = p.other ? `<div class="other" data-for="${p.key}" ${isOn(p)?"":"hidden"}><label for="f-${p.other.key}">${esc(p.other.label)}</label><textarea id="f-${p.other.key}" data-k="${p.other.key}" placeholder="${esc(p.other.placeholder||"")}">${esc(A[p.other.key]||"")}</textarea></div>` : "";
    const err = p.max ? `<p class="err" id="e-${p.key}" aria-live="polite"></p>` : "";
    const pill = p.max ? `<div class="picker">Pick up to ${p.max}<b id="c-${p.key}">${(v||[]).length} / ${p.max}</b></div>` : "";
    return `<div class="part" role="group" ${p.label?`aria-labelledby="l-${p.key}"`:""}>${lab}${pill}<div class="${p.type==="cards"?"opts":"chips"}">${opts}</div>${err}${other}</div>`;
  }
  if (p.type==="select"){
    return `<div class="part"><label class="lab" for="f-${p.key}">${esc(p.label)}</label><select id="f-${p.key}" data-k="${p.key}"><option value="">Select…</option>${p.options.map(o=>`<option ${v===o?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
  }
  if (p.type==="phone"){
    const c = country();
    return `<div class="part"><label class="lab" for="f-phone">${esc(p.label)}</label>
      <div class="phone"><select id="f-cc" aria-label="Country code">${COUNTRIES.map(x=>`<option value="${x[0]}" ${x[0]===c[0]?"selected":""}>${esc(x[1])}${x[2]?" ("+x[2]+")":""}</option>`).join("")}</select>
      <input id="f-phone" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="tel-national" maxlength="15" value="${esc(A.phoneDigits||"")}" placeholder="${c[3]===c[4]?c[3]+" digits":"Numbers only"}"></div>
      <p class="err" id="e-phone" aria-live="polite"></p></div>`;
  }
  const input = p.type==="area"
    ? `<textarea id="f-${p.key}" data-k="${p.key}" placeholder="${esc(p.placeholder||"")}">${esc(v||"")}</textarea>`
    : `<input id="f-${p.key}" data-k="${p.key}" type="${p.type}" value="${esc(v||"")}" placeholder="${esc(p.placeholder||"")}" ${p.type==="tel"?'inputmode="tel" autocomplete="tel"':""} ${p.type==="email"?'autocomplete="email"':""}>`;
  return `<div class="part"><label class="lab" for="f-${p.key}">${esc(p.label)}${p.optional?' <small>(optional)</small>':""}</label>${input}${p.err?`<p class="err" id="e-${p.key}" aria-live="polite"></p>`:""}</div>`;
}
function render(){
  const card = $("#card"), f = flow();
  $("#meter").hidden = idx<0 || idx>=f.length;
  meter();
  if (idx<0){
    card.innerHTML = `
      <span class="step-n">BRAND MATCH</span>
      <h1>Find your brand's perfect match in 90 seconds</h1>
      <p class="sub">Answer a few quick questions, collect XP, and unlock your Brand Match card with ideas for where to start.</p>
      <ul class="intro-list"><li>About 10 taps</li><li>Bonus rounds for your services</li><li>A personal plan from our team</li></ul>
      <div class="nav"><span></span><button class="btn primary" id="go" type="button">Continue →</button></div>`;
    $("#go").onclick = ()=>{ idx=0; render(); };
    $("#go").focus({preventScroll:true});
    return;
  }
  if (idx>=f.length){ return renderResult(); }
  const s = f[idx];
  const main = f.filter(x=>!x.bonus);
  const label = s.bonus ? "BONUS ROUND · +20 XP" : `QUESTION ${main.indexOf(s)+1} OF ${main.length}`;
  card.innerHTML = `
    <span class="step-n">${label}</span>
    <h2 id="q">${esc(s.title)}</h2>${s.sub?`<p class="sub">${esc(s.sub)}</p>`:""}
    ${s.parts.map(partHTML).join("")}
    ${s.final?`<p class="hint">We'll only use these details to contact you about your enquiry.</p>`:""}
    <div class="nav">
      <button class="btn ghost" id="back" type="button">${idx===0?"":"Back"}</button>
      <button class="btn primary" id="next" type="button">${s.final?"Unlock my card →":"Continue →"}</button>
    </div>`;
  if (idx===0) $("#back").style.visibility="hidden";
  sync();
  $("#q").setAttribute("tabindex","-1"); $("#q").focus({preventScroll:true});
  window.scrollTo({top:0,behavior:"smooth"});
}
function sync(){ const s = flow()[idx]; if (s && $("#next")) $("#next").disabled = !valid(s); }

$("#card").addEventListener("click", e=>{
  const b = e.target.closest("[data-k][data-v]");
  if (b){
    const s = flow()[idx], p = s.parts.find(x=>x.key===b.dataset.k), v = b.dataset.v;
    if (p.multi){
      const arr = new Set(A[p.key]||[]);
      const e = document.getElementById("e-"+p.key);
      if (arr.has(v)) arr.delete(v); else { if (p.max && arr.size>=p.max){ if (e) e.textContent = `You can pick up to ${p.max}. Tap one to remove it first.`; return; } arr.add(v); }
      if (e) e.textContent = "";
      const cnt = document.getElementById("c-"+p.key); if (cnt) cnt.textContent = `${arr.size} / ${p.max}`;
      A[p.key] = [...arr];
      b.parentElement.querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed", A[p.key].includes(x.dataset.v)));
    } else {
      A[p.key] = v;
      b.parentElement.querySelectorAll("[data-v]").forEach(x=>x.setAttribute("aria-pressed", x.dataset.v===v));
      // single-question card screens advance on tap
      if (p.type==="cards" && s.parts.length===1 && !isOn(p)){ sync(); setTimeout(next, 260); return; }
    }
    const box = document.querySelector(`.other[data-for="${p.key}"]`);
    if (box){ const was = box.hidden; box.hidden = !isOn(p); if (was && !box.hidden) box.querySelector("textarea").focus(); }
    sync(); return;
  }
  if (e.target.id==="next") next();
  if (e.target.id==="back"){ idx = Math.max(-1, idx-1); render(); }
});
$("#card").addEventListener("input", e=>{
  const t = e.target;
  if (t.id==="f-phone"){
    const clean = t.value.replace(/\D/g,"");
    const err = $("#e-phone");
    if (clean!==t.value){ t.value = clean; err.textContent = "Only numbers, please. No spaces, dashes or +."; } else err.textContent = "";
    A.phoneDigits = clean.slice(0, country()[4]); if (t.value!==A.phoneDigits) t.value = A.phoneDigits;
    A.phone = (country()[2] ? country()[2]+" " : "") + A.phoneDigits;
    sync(); return;
  }
  const k = t.dataset.k; if (k){ A[k] = t.value; if (k==="email" && emailOk(t.value)) $("#e-email").textContent = ""; sync(); }
});
$("#card").addEventListener("change", e=>{
  if (e.target.id==="f-cc"){
    A.country = e.target.value; const c = country();
    $("#f-phone").placeholder = c[3]===c[4] ? c[3]+" digits" : "Numbers only";
    if (A.phoneDigits) A.phone = (c[2]?c[2]+" ":"") + A.phoneDigits;
    sync();
  }
});
$("#card").addEventListener("focusout", e=>{
  if (e.target.id==="f-email"){ $("#e-email").textContent = emailOk(A.email) ? "" : "That email doesn't look right. Check for an @ and a domain, like name@brand.com."; }
  if (e.target.id==="f-phone" && A.phoneDigits && !phoneOk()){
    const c = country(); $("#e-phone").textContent = c[3]===c[4] ? `${c[1]} numbers have ${c[3]} digits.` : `Enter ${c[3]}–${c[4]} digits.`;
  }
});
$("#card").addEventListener("keydown", e=>{ if (e.key==="Enter" && e.target.tagName!=="TEXTAREA" && e.target.tagName!=="BUTTON"){ e.preventDefault(); next(); } });

function next(){
  const f = flow(), s = f[idx];
  if (!s || !valid(s)) return;
  award(s.id, s.final ? 30 : s.bonus ? 20 : 10);
  idx++;
  if (idx>=flow().length) submit(); else render();
}

  const ctx = c.getContext("2d"), W = c.width = c.offsetWidth*devicePixelRatio, H = c.height = c.offsetHeight*devicePixelRatio;

  const ps = Array.from({length:70},()=>({x:Math.random()*W, y:-Math.random()*H*.6, r:(2+Math.random()*4)*devicePixelRatio, vy:(1.5+Math.random()*3)*devicePixelRatio, vx:(Math.random()-.5)*2*devicePixelRatio, c:cols[Math.floor(Math.random()*cols.length)]}));
  let t=0; (function tick(){ ctx.clearRect(0,0,W,H); ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;ctx.fillStyle=p.c;ctx.globalAlpha=Math.max(0,1-t/160);ctx.fillRect(p.x,p.y,p.r,p.r*1.6);}); if(++t<160 && c.isConnected) requestAnimationFrame(tick); else ctx.clearRect(0,0,W,H); })();
}

/* ---------- sending to Google Sheet ---------- */
// STEP: paste your Google Apps Script web app URL between the quotes (see setup guide)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxDxp7NxWUN-YtveS3xZOg1BffCnv-sz4ecpIpQzBlaMU-b2YlHoju5eCKRpfMHNs4owg/exec";
const params = new URLSearchParams(location.search);
async function submit(){
  render();
  const r = resultData();
  const doc = {...A, archetype:r.title, xp,
    source: params.get("utm_source") || params.get("src") || (document.referrer ? new URL(document.referrer).hostname : "direct"),
    campaign: params.get("utm_campaign") || "",
    page: location.origin + location.pathname,
    submittedAt: new Date().toISOString(),
    hp: ($("#hp")||{}).value || ""};
  send(doc);
}
async function send(doc){
  saveMsg = "Sending your answers…"; showMsg();
  if (!/^https:\/\/script\.google\.com\//.test(SCRIPT_URL)){ saveMsg = "This form isn't connected yet. Please contact DG Brandfluencer on Instagram @dgbrandfluencer."; return showMsg(); }
  try{
    await fetch(SCRIPT_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(doc)});
    saved = true; saveMsg = "Your answers are saved. You're all set."; showMsg();
  }catch(e){
    saveMsg = "We couldn't send your answers. Check your internet connection and try again."; showMsg(doc);
  }
}
function showMsg(retryDoc){
  const m = $("#saveMsg"); if (!m) return;
  m.textContent = saveMsg;
  if (retryDoc){ const b = document.createElement("button"); b.type="button"; b.className="btn"; b.textContent="Try again"; b.style.marginLeft="10px"; b.onclick=()=>send(retryDoc); m.append(b); }
}

render();
